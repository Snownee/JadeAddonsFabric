plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

version = project.minecraft_version + "-Fabric-" + project.mod_version
group = project.maven_group
var realVersion = project.mod_version + '+fabric'

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    // trinkets
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.nucleoid.xyz/" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU, Suggestion Tweaker
    maven { url = "https://mvn.devos.one/snapshots/" } // Create, Porting Lib, Forge Tags, Milk Lib
    maven { url = "https://maven.tterrag.com/" } // Registrate and Flywheel
    maven { url = "https://maven.cafeteria.dev/releases/" } // Fake Player API
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://jitpack.io/" } // Mixin Extras, fabric ASM
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
    maven { url = "https://dvs1.progwml6.com/files/maven/" } // JEI
    flatDir { dir 'libs' }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    // for Patchouli
    maven {
        url 'https://maven.blamejared.com'
    }
    // for WTHIT
    maven {
        url 'https://maven.bai.lol'
    }
    maven {
        url = "https://maven.draylar.dev/releases"
        content {
            includeGroup "dev.draylar"
        }
    }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

// Include resources generated by data generators.
sourceSets {
    main.resources.srcDirs += "src/generated/resources"
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

//    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
//        exclude(group: "net.fabricmc.fabric-api")
//    }
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

//    implementation "dev.architectury:architectury-fabric:${project.architectury_version}"
//    implementation "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    //https://modrinth.com/mod/jade/versions
    implementation "maven.modrinth:jade:26.1.9+fabric"
    //implementation "libs:Jade-1.20:fabric-11.5.1"
    //implementation "curse.maven:create-fabric-624165:3913786"
    //https://modrinth.com/mod/lootr/versions
    // 1.23.38.120
    implementation "maven.modrinth:lootr:m1PLActz"
    implementation "maven.modrinth:kiwi:26.0.18+fabric"
    compileOnly "eu.pb4:trinkets:${project.trinkets_version}"

    // create setup
//    implementation("com.simibubi.create:create-fabric-${project.minecraft_version}:${project.create_version}")
// { transitive = false }
    /*
    implementation("io.github.fabricators_of_create.Porting-Lib:porting-lib:${project.port_lib_version}+${project.minecraft_version}")
    //implementation("me.alphamode:ForgeTags:${project.forge_tags_version}")
    implementation("com.electronwill.night-config:core:${project.night_config_core_version}")
    implementation("com.electronwill.night-config:toml:${project.night_config_toml_version}")
    implementation("curse.maven:forge-config-api-port-fabric-547434:${project.config_api_id}") { transitive = false }
    implementation("com.tterrag.registrate_fabric:Registrate:${project.registrate_version}")
    implementation("com.jozufozu.flywheel:flywheel-fabric-${flywheel_minecraft_version}:${project.flywheel_version}")
    implementation("com.jamieswhiteshirt:reach-entity-attributes:${project.reach_entity_attributes_version}")
    implementation("dev.cafeteria:fake-player-api:${project.fake_player_api_version}")
    implementation("io.github.tropheusj:milk-lib:${project.milk_lib_version}")
    implementation("com.google.code.findbugs:jsr305:${project.jsr305_version}")
    */

//    api("teamreborn:energy:${project.tr_energy_version}") {
//        exclude(group: "net.fabricmc.fabric-api")
//    }
//    implementation "dev.emi:trinkets:${project.trinkets_version}"
}

loom {
    //accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

processResources {
    inputs.property "version", realVersion

    filesMatching("fabric.mod.json") {
        expand "version": realVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"

    // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    // withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*.bat'
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(jar) {
                builtBy jar
            }
            //artifact(sourcesJar) {
            //  builtBy remapSourcesJar
            //}
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

publishMods {
    file = tasks.jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][project.release_type]
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    displayName = "[Fabric ${project.supported_version}] ${project.mod_version}"
    version = realVersion

    curseforge {
        projectId = "656665"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires("jade")
    }

    modrinth {
        projectId = "fThnVRli"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires("jade")
    }
}